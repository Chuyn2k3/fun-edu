spring:
  application:
    name: funedu-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/funedu}
    username: ${DB_USER:funedu}
    password: ${DB_PASSWORD:funedu}
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

funedu:
  auth:
    # Required, >= 32 bytes, from the environment only.
    jwt-secret: ${AUTH_JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 90d
    requests-per-minute: 20
    google:
      issuers: [https://accounts.google.com, accounts.google.com]
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
      # Comma-separated OAuth client ids (Android, iOS, web) from Google Cloud.
      client-ids: ${GOOGLE_CLIENT_IDS:}
    apple:
      issuers: [https://appleid.apple.com]
      jwks-uri: https://appleid.apple.com/auth/keys
      # Bundle id for iOS + Services ID for Android/web.
      client-ids: ${APPLE_CLIENT_IDS:com.ibme.funedu}
  apple:
    # Sign in with Apple key (Apple Developer > Keys): exchange codes and
    # revoke tokens on account deletion. Optional; skipped when unset.
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
