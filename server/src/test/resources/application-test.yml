# Tests run on Testcontainers PostgreSQL unless TEST_DB_URL points at an
# existing database (e.g. a sandbox without Docker Hub access).
spring:
  datasource:
    url: ${TEST_DB_URL:}
    username: ${TEST_DB_USER:funedu}
    password: ${TEST_DB_PASSWORD:funedu}
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
  flyway:
    clean-disabled: false
funedu:
  auth:
    jwt-secret: test-secret-that-is-at-least-32-bytes-long!!
    requests-per-minute: 1000
    google:
      client-ids: test-google-client
    apple:
      client-ids: com.ibme.funedu
